<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoreo Hidrometeorológico NEA - Vista Pública</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #fff; }
  #top-bar { background: #1e293b; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; }
  #map-radar { flex: 1; width: 100%; height: 100%; }
  .radar-legend, #panel-rios { position: absolute; z-index: 1000; background: rgba(15, 23, 42, 0.9); padding: 12px; border-radius: 6px; font-size: 12px; border: 1px solid #334155; }
  .radar-legend { bottom: 20px; right: 20px; max-width: 280px; }
  #panel-rios { bottom: 20px; left: 20px; width: 280px; max-height: 45vh; overflow-y: auto; }
</style>
</head>
<body>

<div id="top-bar">
  <div><strong>SISTEMA DE MONITOREO METEOROLÓGICO E HÍDRICO (NEA)</strong></div>
  <div id="reloj" style="font-family: monospace;"></div>
</div>

<div style="position: relative; flex: 1;">
  <div id="map-radar"></div>
  
  <div class="radar-legend">
    <b>⛈️ Radar Meteorológico</b>
    <div>Barrido: <b id="radar-hora" style="color: #f59e0b;">—</b></div>
    <hr style="border-color: #334155; margin: 6px 0;">
    <small>Fuentes: RainViewer · NASA GIBS · Prefectura Naval Argentina</small>
  </div>

  <div id="panel-rios">
    <b>🌊 Niveles de Ríos de la Cuenca</b>
    <div id="lista-rios" style="margin-top: 6px;">Cargando estaciones...</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COP_API_URL = "https://script.google.com/macros/s/AKfycbysuyT9B2-qN_JNaeNAwu2DI4Xvg1W6qffoBk19WMtevEsE05d0cZuKCOXgQeH__sLx6g/exec";

const map = L.map('map-radar', { minZoom: 5, maxZoom: 10 }).setView([-27.5, -59.0], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap, © CARTO' }).addTo(map);

const capaRios = L.layerGroup().addTo(map);

// Carga exclusiva de datos hidrológicos públicos
async function cargarDatosPublicos() {
  try {
    const res = await fetch(`${COP_API_URL}?action=getData&tab=Hidrometria`);
    const json = await res.json();
    if (json.status === 'success' && Array.isArray(json.data)) {
      capaRios.clearLayers();
      const cont = document.getElementById('lista-rios');
      cont.innerHTML = '';

      json.data.forEach(h => {
        let lat = parseFloat(h.Lat), lon = parseFloat(h.Lon);
        if (Math.abs(lat) > 90) lat /= 1000;
        if (Math.abs(lon) > 180) lon /= 1000;
        const alt = parseFloat(String(h.Actual_m).replace(',', '.'));
        const ale = parseFloat(String(h.Alerta_m).replace(',', '.'));
        const eva = parseFloat(String(h.Evacuacion_m).replace(',', '.'));

        let color = '#22c55e';
        let estado = 'NORMAL';
        if (alt >= eva) { color = '#ef4444'; estado = 'EVACUACIÓN'; }
        else if (alt >= ale) { color = '#f59e0b'; estado = 'ALERTA'; }

        if (!isNaN(lat) && !isNaN(lon) && !isNaN(alt)) {
          L.circleMarker([lat, lon], { radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.9 })
            .addTo(capaRios)
            .bindPopup(`<b>${h.Estacion}</b><br>Río: ${h.Rio}<br>Altura: <b>${alt.toFixed(2)} m</b> (${estado})`);

          cont.insertAdjacentHTML('beforeend', `
            <div style="border-bottom: 1px solid #334155; padding: 4px 0;">
              <b style="color: ${color};">● ${h.Estacion}</b>: ${alt.toFixed(2)} m <small>(${estado})</small>
            </div>
          `);
        }
      });
    }
  } catch (e) {
    document.getElementById('lista-rios').innerText = 'Servicio no disponible temporalmente.';
  }
}

// Carga del Radar RainViewer
async function cargarRadar() {
  try {
    const data = await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    const past = data.radar && data.radar.past;
    if (past && past.length > 0) {
      const ultimo = past[past.length - 1];
      L.tileLayer(`${data.host}${ultimo.path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.7 }).addTo(map);
      document.getElementById('radar-hora').innerText = new Date(ultimo.time * 1000).toLocaleTimeString('es-AR');
    }
  } catch (_) {}
}

setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleString('es-AR'); }, 1000);
cargarDatosPublicos();
cargarRadar();
setInterval(cargarDatosPublicos, 60000);
</script>
</body>
</html>
